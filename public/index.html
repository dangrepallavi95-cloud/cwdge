<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CWDGE development environment landing page">
    <title>CWDGE | Workspace Ready</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #f0f6fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0d1117;
      }

      main {
        width: min(100% - 40px, 1080px);
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        align-content: center;
        gap: 64px;
        padding: 72px 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      .mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 1px solid #388bfd;
        border-radius: 8px;
        color: #58a6ff;
        letter-spacing: 0;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #aff5b4;
        font-size: 0.85rem;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3fb950;
        box-shadow: 0 0 0 4px rgba(63, 185, 80, 0.15);
      }

      .hero {
        max-width: 820px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #58a6ff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(3.25rem, 9vw, 7.5rem);
        line-height: 0.92;
        letter-spacing: -0.065em;
      }

      .intro {
        max-width: 650px;
        margin: 28px 0 0;
        color: #b1bac4;
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.65;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid #30363d;
        border-bottom: 1px solid #30363d;
      }

      .detail {
        padding: 24px 20px;
        border-right: 1px solid #30363d;
      }

      .detail:first-child {
        padding-left: 0;
      }

      .detail:last-child {
        border-right: 0;
      }

      .label {
        display: block;
        margin-bottom: 8px;
        color: #7d8590;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .value {
        color: #f0f6fc;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.92rem;
      }

      @media (max-width: 640px) {
        main {
          gap: 48px;
          padding: 40px 0;
        }

        header {
          align-items: flex-start;
        }

        .details {
          grid-template-columns: 1fr;
        }

        .detail,
        .detail:first-child {
          padding: 18px 0;
          border-right: 0;
          border-bottom: 1px solid #30363d;
        }

        .detail:last-child {
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand"><span class="mark">C</span> CWDGE</div>
        <div class="status">Alloy session online</div>
      </header>

      <section class="hero">
        <p class="eyebrow">Development workspace</p>
        <h1>Ready to build.</h1>
        <p class="intro">
          This repository is connected to a reproducible, containerized Alloy environment.
          The workspace is running and ready for the first product iteration.
        </p>
      </section>

      <section class="details" aria-label="Environment details">
        <div class="detail">
          <span class="label">Runtime</span>
          <span class="value">nginx:1.27-alpine</span>
        </div>
        <div class="detail">
          <span class="label">Application port</span>
          <span class="value">3000</span>
        </div>
        <div class="detail">
          <span class="label">Health check</span>
          <span class="value">GET /health</span>
        </div>
      </section>
    </main>
  </body>
</html>
